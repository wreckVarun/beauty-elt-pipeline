name: beauty_analytics
version: "1.0.0"
config-version: 2
profile: beauty_analytics

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  beauty_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

data_tests:
  beauty_analytics:
    # every failing row is written to an audit table (schema main_audit)
    # and then exported by pipeline/export_test_failures.py for review
    +store_failures: true
    +schema: audit

# The LLM tag table is written by pipeline/enrich_reviews.py; make sure it exists so the
# first build (before any enrichment has run) can still compile and test against it.
on-run-start:
  - "create schema if not exists llm"
  - >
    create table if not exists llm.review_tags (
      review_id varchar, labeler varchar, model varchar, sentiment varchar,
      complaint_type varchar, is_complaint boolean, evidence varchar, tagged_at timestamp)
