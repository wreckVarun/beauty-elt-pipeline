name: daily-pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      labeler:
        description: "LLM labeler (gemini or keyword)"
        default: gemini

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ github.workspace }}/data
      ENRICH_LABELER: ${{ inputs.labeler || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The warehouse and the load watermark are carried between runs by the cache, so
      # each scheduled run picks up where the previous one stopped (incremental load).
      - name: Restore warehouse
        uses: actions/cache@v4
        with:
          path: data
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Run pipeline
        run: ./run_pipeline.sh --source kaggle --days 1

      - name: Upload dashboard and failed records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_number }}
          path: |
            reports/dashboard.html
            data/test_failures/**
            beauty_dbt/target/run_results.json
          if-no-files-found: warn
